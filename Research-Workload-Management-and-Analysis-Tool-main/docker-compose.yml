version: '3.8'

services:
  # 1. Database: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: research_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: research_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d research_system"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. File Storage: MinIO
  minio:
    image: minio/minio
    container_name: research_storage
    environment:
      MINIO_ROOT_USER: admin_minio
      MINIO_ROOT_PASSWORD: minio_password123
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Web UI Console Port
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  # 3. PDF Parser: GROBID
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: research_grobid
    ports:
      - "8070:8070"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata: